<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnnotateWeb</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup">
    <div class="header">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        <span>AnnotateWeb</span>
      </div>
      <div class="badge" id="badge" style="display: none;">0</div>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">Annotations</span>
      <label class="toggle-switch">
        <input type="checkbox" id="toggleSwitch">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="status" id="status">
      <span class="status-dot inactive"></span>
      <span class="status-text">Inactive</span>
    </div>

    <div class="divider"></div>

    <div class="actions" id="actions">
      <button class="action-btn" id="screenshotBtn">
        <span class="action-icon">
          <svg width="16" height="13" viewBox="0 0 24 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M23 17C23 17.5304 22.7893 18.0391 22.4142 18.4142C22.0391 18.7893 21.5304 19 21 19H3C2.46957 19 1.96086 18.7893 1.58579 18.4142C1.21071 18.0391 1 17.5304 1 17V6C1 5.46957 1.21071 4.96086 1.58579 4.58579C1.96086 4.21071 2.46957 4 3 4H7L9 1H15L17 4H21C21.5304 4 22.0391 4.21071 22.4142 4.58579C22.7893 4.96086 23 5.46957 23 6V17Z"
              stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path
              d="M12 15C14.2091 15 16 13.2091 16 11C16 8.79086 14.2091 7 12 7C9.79086 7 8 8.79086 8 11C8 13.2091 9.79086 15 12 15Z"
              stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span>Screenshot Page</span>
      </button>
      <button class="action-btn" id="gridScreenshotBtn">
        <span class="action-icon">
          <svg width="14" height="14" viewBox="0 0 11 11" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M0 10.464V0H10.464V10.464H0ZM1.136 4.672H4.656V1.136H1.136V4.672ZM5.792 4.672H9.328V1.136H5.792V4.672ZM1.136 9.328H4.656V5.808H1.136V9.328ZM5.792 9.328H9.328V5.808H5.792V9.328Z"
              fill="white" />
          </svg>
        </span>
        <span>Screenshot Grid</span>
      </button>
    </div>

    <div class="footer">
      <span>Powered by <a href="https://agentation.dev" target="_blank">Agentation</a></span>
    </div>
  </div>

  <script src="popup.js" type="module"></script>
</body>

</html>
